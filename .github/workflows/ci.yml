name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-test.txt
      - name: Health agent tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Catalog tests
        run: python kuper_catalog_prototype/test_parser.py
      - name: Nutrition parser tests
        run: node kuper_catalog_prototype/test_nutrition_parser.js
      - name: Chat formatting and stream tests
        run: node --test scripts/test_chat_stream.mjs
      - name: Frontend build
        run: pnpm build
